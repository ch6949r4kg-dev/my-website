
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nongbiw Credit Review</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#ad6b8d
}
header,.review{
  background:linear-gradient(145deg,#fff5fa,#ffedf6);
  border:1px solid #ffe0ed;
  border-radius:24px;
  padding:22px 16px;
  margin-bottom:16px
}
header{text-align:center}
.brand{
  font-size:43px;font-weight:800;
  color:#e276aa;margin:8px 0
}
.subtitle{letter-spacing:4px;font-size:16px}
.decoration{font-size:25px;margin:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{
  background:white;border-radius:22px;
  padding:18px 5px;text-align:center
}
.stat-label{font-size:12px;letter-spacing:1px}
.stat-value{font-size:30px;font-weight:bold;
  color:#db75a7;margin-top:8px}
h3{text-align:center;font-size:19px}
.stars{display:flex;justify-content:center;gap:8px}
.stars button{
  background:none;border:0;font-size:32px;
  color:#e9dce3;padding:2px;cursor:pointer
}
.stars button.active{color:#ffbd59}
input,textarea{
  width:100%;padding:12px;margin:7px 0;
  border:1px solid #f3d1e1;border-radius:13px;
  font:inherit;font-size:14px
}
textarea{resize:vertical}
.submit{
  width:100%;padding:13px;border:0;
  border-radius:14px;color:white;font-size:15px;
  background:linear-gradient(90deg,#f0b4d1,#e995bd)
}
.item{
  background:white;padding:13px;border-radius:14px;
  margin-top:10px;overflow-wrap:anywhere
}
.item-stars{color:#ffbd59;margin:6px 0}
.comment{white-space:pre-wrap}
</style>
</head>
<body>

<header>
  <div>♡ OFFICIAL CREDIT ♡</div>
  <div class="brand">Nongbiw 🎀</div>
  <div class="subtitle">CREDIT · REVIEW</div>
  <div class="decoration">୨୧ ♡ ✧ 💗 ✧ ♡ ୨୧</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">RATING</div>
      <div class="stat-value" id="average">— ⭐</div>
    </div>
    <div class="stat">
      <div class="stat-label">TOTAL COMMENTS</div>
      <div class="stat-value" id="count">0</div>
    </div>
  </div>
</header>

<section class="review">
  <h3>♡ รีวิวความพึงพอใจ ♡</h3>

  <div class="stars" id="starPicker">
    <button type="button" data-star="1">★</button>
    <button type="button" data-star="2">★</button>
    <button type="button" data-star="3">★</button>
    <button type="button" data-star="4">★</button>
    <button type="button" data-star="5">★</button>
  </div>
  <p id="hint" style="text-align:center">
    กดเลือกดาวที่ต้องการ ♡
  </p>

  <form id="form">
    <input id="name" maxlength="40"
      placeholder="ชื่อของคุณ" required>
    <textarea id="comment" rows="3" maxlength="1000"
      placeholder="เขียนความคิดเห็น..." required></textarea>
    <button class="submit" type="submit">ส่งรีวิว ♡</button>
  </form>

  <h3 style="text-align:left">ความคิดเห็นจากลูกค้า</h3>
  <div id="list">ยังไม่มีรีวิว ♡</div>
</section>

<script>
let rating=0, reviews=[];
const key="nongbiw-reviews-demo";

try {
  const data=JSON.parse(localStorage.getItem(key)||"[]");
  if(Array.isArray(data)) reviews=data.filter(r=>
    r && typeof r.name==="string" &&
    typeof r.comment==="string" &&
    Number.isInteger(r.rating) && r.rating>=1 && r.rating<=5
  );
} catch(e) {}

const buttons=document.querySelectorAll("#starPicker button");

buttons.forEach(btn=>btn.onclick=()=>{
  rating=Number(btn.dataset.star);
  buttons.forEach(b=>
    b.classList.toggle("active",Number(b.dataset.star)<=rating)
  );
  document.getElementById("hint").textContent=
    `เลือกแล้ว ${rating} ดาว ♡`;
});

function render(){
  document.getElementById("count").textContent=reviews.length;
  const avg=reviews.length
    ?reviews.reduce((s,r)=>s+r.rating,0)/reviews.length:null;
  document.getElementById("average").textContent=
    avg===null?"— ⭐":avg.toFixed(1)+" ⭐";

  const list=document.getElementById("list");
  list.replaceChildren();

  if(!reviews.length){
    list.textContent="ยังไม่มีรีวิว ♡";
    return;
  }

  reviews.slice().reverse().forEach(r=>{
    const item=document.createElement("div");
    item.className="item";

    const name=document.createElement("strong");
    name.textContent=r.name+" 🎀";

    const stars=document.createElement("div");
    stars.className="item-stars";
    stars.textContent="★".repeat(r.rating)+"☆".repeat(5-r.rating);

    const comment=document.createElement("div");
    comment.className="comment";
    comment.textContent=r.comment;

    item.append(name,stars,comment);
    list.append(item);
  });
}

document.getElementById("form").onsubmit=e=>{
  e.preventDefault();
  if(!rating){
    alert("เลือกดาวก่อนนะคะ ♡");
    return;
  }

  reviews.push({
    name:document.getElementById("name").value.trim(),
    rating,
    comment:document.getElementById("comment").value.trim()
  });

  try{
    localStorage.setItem(key,JSON.stringify(reviews));
  }catch(err){
    reviews.pop();
    alert("บันทึกรีวิวในเครื่องไม่สำเร็จ");
    return;
  }

  e.target.reset();
  rating=0;
  buttons.forEach(b=>b.classList.remove("active"));
  document.getElementById("hint").textContent="กดเลือกดาวที่ต้องการ ♡";
  render();
};

render();
</script>
</body>
</html>
