<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nongbiw ♡</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffe4ef,#fff5fa,#ffd6e8);
  color:#d94f8b;
  text-align:center;
  padding:24px 14px;
}

.container{
  max-width:460px;
  margin:auto
}

h1{
  font-size:30px;
  margin:12px 0
}

.subtitle{
  font-size:19px;
  margin-bottom:24px
}

.photo{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:50%;
  border:6px solid white;
  box-shadow:0 5px 18px #e9a2c5;
}

.card{
  background:#ffffffd9;
  border:2px solid #ffc1dc;
  border-radius:25px;
  padding:20px;
  margin:18px 0;
  box-shadow:0 5px 14px #edb5cf55;
}

h2{
  font-size:21px;
  margin:4px 0 16px
}

.contact{
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  justify-content:center;
  margin:10px 0;
  flex-wrap:wrap;
}

.qr{
  width:115px;
  height:115px;
  object-fit:contain;
  border-radius:10px;
  background:white;
}

a{
  color:#d94f8b;
  overflow-wrap:anywhere;
  text-decoration:none;
}

.id{
  font-size:17px;
  font-weight:bold
}

button{
  background:#f58db8;
  color:white;
  border:0;
  padding:12px 22px;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
}

.music{
  padding:12px 15px;
}

.music h2{
  margin:4px 0 8px;
  font-size:18px;
}

.music p{
  font-size:13px;
  margin:5px 0 10px;
}

audio{
  width:100%;
  height:38px;
}

.heart{
  font-size:22px
}

footer{
  font-size:13px;
  padding:12px
}
</style>
</head>

<body>

<div class="container">

  <div class="heart">🎀 ♡ ✨ ♡ 🎀</div>

  <!-- รูปบิว -->
  <img class="photo"
       src="IMG_2844.jpeg"
       alt="รูปบิว">

  <h1>ช่องทางการติดต่อ</h1>
  <div class="subtitle">♡ Nongbiw ♡</div>

  <!-- LINE -->
  <section class="card">
    <h2>🎀 LINE 🎀</h2>

    <div class="contact">

      <img class="qr"
           src="IMG_2485.png"
           alt="QR Code LINE">

      <div>
        <div class="id">ID LINE</div>
        <p>@282ppxul</p>

        <a href="https://line.me/R/ti/p/@282ppxul">
          <button>เพิ่มเพื่อน ♡</button>
        </a>
      </div>

    </div>
  </section>

  <!-- Telegram -->
  <section class="card">
    <h2>🩵 Telegram 🩵</h2>

    <div class="contact">

      <img class="qr"
           src="IMG_2863.jpeg"
           alt="QR Code Telegram">

      <div>
        <div class="id">ID Telegram</div>
        <p>@Sunitra1407</p>

        <a href="https://t.me/Sunitra1407">
          <button>ทัก Telegram ♡</button>
        </a>
      </div>

    </div>
  </section>

  <!-- เพลง -->
  <section class="card music">

    <h2>🎵 เพลง ธรรมดา 🎵</h2>

    <audio id="music" controls autoplay loop>
      <source src="thammada.mp3" type="audio/mpeg">
      เบราว์เซอร์ของคุณไม่รองรับการเล่นเพลง
    </audio>

  </section>

  <div class="heart">
    ♡ ขอบคุณที่แวะมานะคะ ♡
  </div>

  <footer>
    Made with love 🎀 Nongbiw
  </footer>

</div>

<script>
const music = document.getElementById("music");

window.addEventListener("load", () => {
  music.play().catch(() => {
    console.log("ต้องแตะหน้าจอก่อนจึงจะเล่นเพลงได้");
  });
});
</script>

</body>
</html>
